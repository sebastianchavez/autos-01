<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AutoTotal — Detalle del pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#dc2626", "primary-dark": "#991b1b", accent: "#171717", "background-light": "#f6f7f8", "background-dark": "#101922" }, fontFamily: { display: ["Inter", "sans-serif"] }, borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" } } } }
</script>
<link rel="stylesheet" href="assets/css/styles.css"/>
</head>
<body class="font-display bg-background-light">
<div id="appHeader"></div>

<main class="px-4 sm:px-6 lg:px-8 pt-6 pb-12">
  <nav class="flex items-center gap-2 text-sm text-slate-500 mb-4">
    <a href="index.html" class="hover:text-primary">Inicio</a>
    <span class="material-symbols-outlined !text-base">chevron_right</span>
    <a href="perfil.html" class="hover:text-primary">Mi perfil</a>
    <span class="material-symbols-outlined !text-base">chevron_right</span>
    <span class="text-slate-900 font-bold" id="bcOrderId">Pedido</span>
  </nav>

  <div class="bg-white rounded-xl border border-slate-200 p-6 mb-6">
    <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
      <div>
        <p class="text-xs font-black uppercase text-slate-500 mb-1">Pedido</p>
        <h1 class="text-2xl font-black" id="orderId">—</h1>
        <p class="text-sm text-slate-500 mt-1">Realizado el <span id="orderDate">—</span></p>
      </div>
      <div class="text-right">
        <span id="orderStatus" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm font-bold"></span>
        <p class="text-xs text-slate-500 mt-2">Total <span class="text-lg font-black" id="orderTotal">$0</span></p>
      </div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="orderTimeline"></div>
  </div>

  <div class="grid lg:grid-cols-[1fr_320px] gap-6">
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <h2 class="text-lg font-black mb-4">Productos del pedido</h2>
      <div id="orderProducts" class="space-y-3"></div>
    </div>

    <aside class="space-y-4">
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="text-sm font-black uppercase text-slate-500 mb-3 flex items-center gap-2"><span class="material-symbols-outlined text-primary !text-base">location_on</span>Dirección de envío</h3>
        <p class="text-sm font-bold" id="shipAddress">—</p>
        <p class="text-xs text-slate-500 mt-2">Recibido por <span id="receiverName">—</span></p>
        <p class="text-xs text-slate-500" id="receiverPhone">—</p>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="text-sm font-black uppercase text-slate-500 mb-3 flex items-center gap-2"><span class="material-symbols-outlined text-primary !text-base">credit_card</span>Pago</h3>
        <p class="text-sm font-bold capitalize" id="paymentMethod">—</p>
        <p class="text-xs text-slate-500 mt-2">Estado: <span class="text-green-600 font-bold">Pagado</span></p>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="text-sm font-black uppercase text-slate-500 mb-3">Resumen</h3>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between"><span class="text-slate-600">Subtotal</span><span class="font-bold" id="subtotalFinal">$0</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Envío</span><span class="font-bold" id="shippingFinal">$0</span></div>
          <div class="flex justify-between border-t border-slate-200 pt-2 mt-2"><span class="font-black">Total</span><span class="font-black text-primary text-lg" id="totalFinal">$0</span></div>
        </div>
      </div>
    </aside>
  </div>
</main>

<div id="appFooter"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
renderHeader();
renderFooter();

const TIMELINE = [
  { label: "Recibido", icon: "check",            date: "Hoy" },
  { label: "Preparando", icon: "inventory_2",   date: "Mañana" },
  { label: "En camino",  icon: "local_shipping", date: "2-5 días" },
  { label: "Entregado",  icon: "home",           date: "Pronto" }
];

const params = new URLSearchParams(location.search);
const id = params.get("id") || ORDERS[0].id;
const order = ORDERS.find(o => o.id === id) || ORDERS[0];
const s = ORDER_STATUS[order.status];

document.getElementById("orderId").textContent = order.id;
document.getElementById("bcOrderId").textContent = order.id;
document.getElementById("orderDate").textContent = new Date(order.date).toLocaleDateString("es-CL", { year: "numeric", month: "long", day: "numeric" });
document.getElementById("orderTotal").textContent = clp(order.total);
document.getElementById("shipAddress").textContent = order.address;
document.getElementById("receiverName").textContent = CURRENT_USER.fullName;
document.getElementById("receiverPhone").textContent = CURRENT_USER.phone;
document.getElementById("paymentMethod").textContent = order.payment;
document.getElementById("subtotalFinal").textContent = clp(order.total - order.shipping);
document.getElementById("shippingFinal").textContent = order.shipping === 0 ? "Gratis" : clp(order.shipping);
document.getElementById("totalFinal").textContent = clp(order.total);

document.getElementById("orderStatus").className = `inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm font-bold ${s.class}`;
document.getElementById("orderStatus").innerHTML = `<span class="material-symbols-outlined !text-base">${s.icon}</span>${s.label}`;

document.getElementById("orderTimeline").innerHTML = TIMELINE.map((t, i) => {
  const reached = i < s.progress, active = i === s.progress - 1;
  return `
    <div class="text-center">
      <div class="size-12 mx-auto rounded-full ${reached ? "bg-primary text-white" : "bg-slate-200 text-slate-500"} flex items-center justify-center font-black ${active ? "ring-4 ring-primary/20" : ""}">
        <span class="material-symbols-outlined">${t.icon}</span>
      </div>
      <p class="text-xs font-bold ${reached ? "text-slate-900" : "text-slate-500"} mt-2">${t.label}</p>
      <p class="text-xs text-slate-400">${t.date}</p>
    </div>`;
}).join("");

document.getElementById("orderProducts").innerHTML = order.products.map(pid => {
  const p = PRODUCTS.find(x => x.id === pid);
  if (!p) return "";
  const reviewCta = order.status === "delivered" ? `
    <a href="resena.html?id=${p.id}" class="inline-flex items-center gap-1 mt-2 px-3 py-1.5 bg-primary text-white rounded-lg text-xs font-bold hover:bg-primary-dark">
      <span class="material-symbols-outlined !text-sm">rate_review</span>Dejar reseña
    </a>` : "";
  return `
  <div class="flex gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200">
    ${productMiniCardHTML(p)}
    <div class="flex-1 min-w-0">
      <a href="producto.html?id=${p.id}" class="font-bold hover:text-primary line-clamp-2">${p.name}</a>
      <p class="text-xs text-slate-500 mt-1">Cant: 1 × ${clp(p.price)}</p>
    </div>
    <div class="text-right">
      <p class="font-black">${clp(p.price)}</p>
      ${reviewCta}
    </div>
  </div>`;
}).join("");
</script>
</body>
</html>
