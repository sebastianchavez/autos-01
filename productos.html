<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AutoTotal — Productos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: { colors: { primary: "#dc2626", "primary-dark": "#991b1b", accent: "#171717", "background-light": "#f6f7f8", "background-dark": "#101922" }, fontFamily: { display: ["Inter", "sans-serif"] }, borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" } } }
}
</script>
<link rel="stylesheet" href="assets/css/styles.css"/>
</head>
<body class="font-display bg-background-light">
<div id="appHeader" data-active="productos"></div>

<main class="px-4 sm:px-6 lg:px-8 pt-6 pb-12">
  <nav class="flex items-center gap-2 text-sm text-slate-500 mb-4">
    <a href="index.html" class="hover:text-primary">Inicio</a>
    <span class="material-symbols-outlined !text-base">chevron_right</span>
    <span class="text-slate-900 font-bold">Catálogo</span>
  </nav>

  <!-- Hero Catálogo -->
  <div class="bg-accent rounded-2xl p-8 sm:p-10 text-white relative overflow-hidden mb-6">
    <div class="absolute -right-12 -top-12 size-64 bg-primary rounded-full opacity-20 blur-3xl"></div>
    <h1 class="text-3xl sm:text-4xl font-black mb-2">Catálogo completo</h1>
    <p class="text-slate-300 text-sm sm:text-base"><span id="resultCount">14</span> productos disponibles · Repuestos, accesorios, herramientas y servicios</p>
  </div>

  <div class="grid lg:grid-cols-[280px_1fr] gap-6">
    <!-- Sidebar -->
    <aside class="bg-white rounded-xl p-5 border border-slate-200 h-fit lg:sticky lg-top-24">
      <h3 class="text-slate-900 font-black mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">tune</span>Filtros
      </h3>

      <div class="mb-5">
        <h4 class="text-xs font-black uppercase text-slate-500 mb-3">Categoría</h4>
        <div id="categoryFilters" class="space-y-2"></div>
      </div>

      <div class="mb-5">
        <h4 class="text-xs font-black uppercase text-slate-500 mb-3">Precio</h4>
        <div class="space-y-2">
          <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="price" value="all" checked class="accent-primary"/>Todos</label>
          <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="price" value="0-20000" class="accent-primary"/>Hasta $20.000</label>
          <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="price" value="20000-50000" class="accent-primary"/>$20.000 - $50.000</label>
          <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="price" value="50000-100000" class="accent-primary"/>$50.000 - $100.000</label>
          <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="price" value="100000" class="accent-primary"/>Más de $100.000</label>
        </div>
      </div>

      <div class="mb-5">
        <h4 class="text-xs font-black uppercase text-slate-500 mb-3">Marca</h4>
        <div id="brandFilters" class="space-y-2"></div>
      </div>

      <div class="mb-5">
        <h4 class="text-xs font-black uppercase text-slate-500 mb-3">Valoración</h4>
        <div class="space-y-2">
          <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="rating" value="all" checked class="accent-primary"/>Todas</label>
          <label class="flex items-center gap-2 text-sm cursor-pointer text-yellow-500"><input type="radio" name="rating" value="4" class="accent-primary"/>4★ y más</label>
          <label class="flex items-center gap-2 text-sm cursor-pointer text-yellow-500"><input type="radio" name="rating" value="4.5" class="accent-primary"/>4.5★ y más</label>
        </div>
      </div>

      <button id="clearFilters" class="w-full flex items-center justify-center gap-2 rounded-lg h-10 bg-slate-100 text-slate-700 text-sm font-bold hover:bg-slate-200">
        <span class="material-symbols-outlined !text-base">refresh</span>Limpiar filtros
      </button>
    </aside>

    <!-- Grid -->
    <div>
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5 bg-white p-3 rounded-xl border border-slate-200">
        <span class="text-sm text-slate-600"><span id="visibleCount">14</span> resultados</span>
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500">Ordenar:</span>
          <select id="sortSelect" class="form-select text-sm rounded-lg border-slate-200 bg-slate-100 focus:ring-primary focus:border-primary">
            <option value="featured">Destacados</option>
            <option value="price-asc">Menor precio</option>
            <option value="price-desc">Mayor precio</option>
            <option value="rating">Mejor valoración</option>
            <option value="name">A-Z</option>
          </select>
        </div>
      </div>
      <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      <div id="emptyState" class="hidden bg-white rounded-xl p-12 text-center border border-slate-200">
        <span class="material-symbols-outlined text-6xl text-slate-300">search_off</span>
        <h3 class="text-xl font-black text-slate-900 mt-4">Sin resultados</h3>
        <p class="text-slate-500 text-sm mt-2">Intenta ajustar los filtros o limpiar la búsqueda.</p>
      </div>
    </div>
  </div>
</main>

<div id="appFooter"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
renderHeader("productos");
renderFooter();

const filters = { category: new Set(), brand: new Set(), price: "all", rating: "all", q: "", sort: "featured" };

function setupCategoryFilters() {
  const el = document.getElementById("categoryFilters");
  el.innerHTML = CATEGORIES.map(c => `
    <label class="flex items-center gap-2 text-sm cursor-pointer">
      <input type="checkbox" value="${c.key}" class="cat-checkbox accent-primary"/>
      <span class="material-symbols-outlined !text-base text-slate-500">${c.icon}</span>${c.label}
    </label>`).join("");
  el.addEventListener("change", () => {
    filters.category = new Set([...el.querySelectorAll(".cat-checkbox:checked")].map(c => c.value));
    applyFilters();
  });
}
function setupBrandFilters() {
  const brands = [...new Set(PRODUCTS.map(p => p.brand))];
  const el = document.getElementById("brandFilters");
  el.innerHTML = brands.map(b => `
    <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="${b}" class="brand-checkbox accent-primary"/>${b}</label>`).join("");
  el.addEventListener("change", () => {
    filters.brand = new Set([...el.querySelectorAll(".brand-checkbox:checked")].map(c => c.value));
    applyFilters();
  });
}
function priceMatches(p) {
  if (filters.price === "all") return true;
  if (filters.price === "100000") return p.price >= 100000;
  const [a, b] = filters.price.split("-").map(Number);
  return p.price >= a && p.price < b;
}
function applyFilters() {
  let list = PRODUCTS.slice();
  if (filters.category.size > 0) list = list.filter(p => filters.category.has(p.category));
  if (filters.brand.size > 0) list = list.filter(p => filters.brand.has(p.brand));
  list = list.filter(priceMatches);
  if (filters.rating !== "all") list = list.filter(p => p.rating >= parseFloat(filters.rating));
  if (filters.q) list = list.filter(p => p.name.toLowerCase().includes(filters.q.toLowerCase()));
  if (filters.sort === "price-asc") list.sort((a, b) => a.price - b.price);
  else if (filters.sort === "price-desc") list.sort((a, b) => b.price - a.price);
  else if (filters.sort === "rating") list.sort((a, b) => b.rating - a.rating);
  else if (filters.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
  else list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

  const grid = document.getElementById("productsGrid");
  const empty = document.getElementById("emptyState");
  if (list.length === 0) { grid.innerHTML = ""; empty.classList.remove("hidden"); }
  else { empty.classList.add("hidden"); grid.innerHTML = list.map(productCardHTML).join(""); }
  document.getElementById("visibleCount").textContent = list.length;
  document.getElementById("resultCount").textContent = PRODUCTS.length;
}

const params = new URLSearchParams(location.search);
const initialCat = params.get("cat");
if (initialCat) {
  filters.category = new Set([initialCat]);
  setTimeout(() => {
    const cb = document.querySelector(`.cat-checkbox[value="${initialCat}"]`);
    if (cb) cb.checked = true;
  }, 50);
}

document.querySelectorAll('input[name="price"]').forEach(r => r.addEventListener("change", e => { filters.price = e.target.value; applyFilters(); }));
document.querySelectorAll('input[name="rating"]').forEach(r => r.addEventListener("change", e => { filters.rating = e.target.value; applyFilters(); }));
document.getElementById("sortSelect").addEventListener("change", e => { filters.sort = e.target.value; applyFilters(); });
document.getElementById("clearFilters").addEventListener("click", () => {
  filters.category = new Set(); filters.brand = new Set();
  filters.price = "all"; filters.rating = "all"; filters.sort = "featured";
  document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
  document.querySelector('input[name="price"][value="all"]').checked = true;
  document.querySelector('input[name="rating"][value="all"]').checked = true;
  document.getElementById("sortSelect").value = "featured";
  applyFilters();
});

setupCategoryFilters();
setupBrandFilters();
applyFilters();
</script>
</body>
</html>
